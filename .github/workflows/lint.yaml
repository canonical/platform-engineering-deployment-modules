name: Terraform files test

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate terraform configuration files
    runs-on: ubuntu-latest
    env:
      WORKING_DIR: 'deployments'
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Run terraform fmt
        run: terraform fmt -check -recursive
        working-directory: ${{env.WORKING_DIR}}

      - name: Setup Tflint
        uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_wrapper_enabled: true

      - name: Run tflint
        run: |
          tflint --version
          tflint --init
          tflint -f compact --recursive
        working-directory: ${{env.WORKING_DIR}}

  renovate-comments:
    name: Check renovate comments on charm revisions
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Run check-renovate-comments
        run: scripts/check-renovate-comments.py

  renovate-config:
    name: Validate renovate.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0

      - name: Run renovate-config-validator
        run: npx --yes --package renovate -- renovate-config-validator renovate.json
