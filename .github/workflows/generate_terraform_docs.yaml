name: Update Terraform documentation

# Keep the `paths` filters below and the `terraform-directory` input in sync with
# the directories where the Terraform deployment modules live.
on:
  pull_request:
    paths:
      - "deployments/**"
  push:
    branches:
      - main
    paths:
      - "deployments/**"

jobs:
  terraform-docs:
    name: Update Terraform documentation
    # Needed to commit the generated docs and open the terraform-docs PR.
    permissions:
      contents: write
      pull-requests: write
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@4cd64727ffba2e8698659deec6d8b3c8453b79be  # main
    secrets: inherit
    with:
      terraform-directory: >-
        deployments/bingo/ps7,
        deployments/falco/ps7,
        deployments/falcosidekick/ps7,
        deployments/gopkg/ps7,
        deployments/lego/ps6,
        deployments/mattermost/ps7,
        deployments/opencti/ps6,
        deployments/wazuh/ps6