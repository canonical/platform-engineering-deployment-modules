name: Update Terraform documentation

# Keep the `paths` filters below and the `terraform-directory` input in sync with
# the directories where the Terraform deployment modules live.
on:
  pull_request:
    paths:
      - "deployments/**"
  push:
    branches:
      - main
    paths:
      - "deployments/**"

jobs:
  terraform-docs:
    name: Update Terraform documentation
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@5dbf925ede6288e3b7759114da363bcadada5f1f  # main
    secrets: inherit
    with:
      terraform-directory: >-
        deployments/bingo/ps7,
        deployments/falco/ps7,
        deployments/falcosidekick/ps7,
        deployments/lego/ps6,
        deployments/opencti/ps6,
        deployments/wazuh/ps6